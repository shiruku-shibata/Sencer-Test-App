; ============================================================
; センサーテストアプリ用 送信ファームウェア (PlatformIO)
;
; ビルド : pio run
; 書き込み: pio run -t upload
; 受信確認: pio device monitor      （終了は Ctrl+C）
; ============================================================

[platformio]
default_envs = m5stickc_plus2

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
build_flags =
	-DCORE_DEBUG_LEVEL=0
lib_deps =
	; バージョンを固定したい場合は m5stack/M5Unified@^0.2.7 のように指定する
	m5stack/M5Unified

; --- M5StickC Plus2 用（本命） ---
[env:m5stickc_plus2]
board = m5stickc_plus2

; --- ボード定義 m5stickc_plus2 が見つからない場合のフォールバック ---
;   pio pkg update -g -p espressif32
; で更新するか、それでも駄目なときは下のenvでビルドする。
;   pio run -e m5stick_c_fallback -t upload
[env:m5stick_c_fallback]
board = m5stick-c
