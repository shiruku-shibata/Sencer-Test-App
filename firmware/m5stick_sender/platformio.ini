; ============================================================
; センサーテストアプリ用 送信ファームウェア (PlatformIO)
;
; ビルド    : pio run                       （既定 = M5StickC Plus2）
; 機種指定  : pio run -e m5stack_core2
; 書き込み  : pio run -e m5stickc_plus2 -t upload
; 受信確認  : pio device monitor            （終了は Ctrl+C）
; 単体テスト: pio test -e native            （PC 上で純粋ロジックをテスト）
;
; 詳しくは README.md を参照。
; ============================================================

[platformio]
default_envs = m5stickc_plus2

; ------------------------------------------------------------
; ESP32 系の共通設定（各機種 env が extends する）
;   バージョンはすべて固定して、いつビルドしても同じ結果になるようにする。
;   更新するときは全 env をビルドし直して README の表も直すこと。
; ------------------------------------------------------------
[esp32_base]
; Arduino-ESP32 2.0.17（ESP-IDF 4.4 ベース）。platform 6.x 系の最終版を固定。
platform = platformio/espressif32@6.13.0
platform_packages =
	platformio/framework-arduinoespressif32@3.20017.241212
framework = arduino
monitor_speed = 115200
monitor_filters = direct
monitor_echo = yes
upload_speed = 1500000
build_flags =
	-DCORE_DEBUG_LEVEL=0
	; NimBLE: 使わない役割（セントラル／オブザーバ）を外してフラッシュとRAMを節約
	-DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
	-DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
	; NimBLE: 同時接続は1台で十分
	-DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
; 自分で書いた src/ だけ警告を厳しめにする（ライブラリの警告で埋もれないように）
build_src_flags =
	-Wall
	-Wextra
lib_deps =
	m5stack/M5Unified@0.2.26
	m5stack/M5GFX@0.2.33
	h2zero/NimBLE-Arduino@2.5.1

; --- M5StickC Plus2（本命・既定） ---
;   ボード定義 m5stack-stickc-plus2 は platform 6.x に無いため、
;   このフォルダの boards/m5stack-stickc-plus2.json（同名のローカル定義）を使う。
[env:m5stickc_plus2]
extends = esp32_base
board = m5stack-stickc-plus2

; --- M5StickC Plus ---
;   ボード定義はローカルの boards/m5stack-stickc-plus.json を使う（理由は上と同じ）。
[env:m5stickc_plus]
extends = esp32_base
board = m5stack-stickc-plus

; --- M5StickC（初代） ---
[env:m5stickc]
extends = esp32_base
board = m5stick-c

; --- M5Stack Core2 ---
[env:m5stack_core2]
extends = esp32_base
board = m5stack-core2

; --- M5Stack CoreS3 ---
[env:m5stack_cores3]
extends = esp32_base
board = m5stack-cores3

; --- M5Stack AtomS3 ---
[env:m5stack_atoms3]
extends = esp32_base
board = m5stack-atoms3
;   AtomS3 の USB-C は ESP32-S3 内蔵の USB シリアルにつながっている。
;   ボード定義に CDC_ON_BOOT が無いと Serial が USB に出ないので追加する。
build_flags =
	${esp32_base.build_flags}
	-DARDUINO_USB_CDC_ON_BOOT=1

; --- M5Stack ATOM Matrix など（MPU6886 搭載の初代 ATOM） ---
;   ATOM の USB シリアル変換は高速書き込みに弱いので 115200 で書き込む。
[env:m5stack_atom]
extends = esp32_base
board = m5stack-atom
upload_speed = 115200

; ------------------------------------------------------------
; PC 上で動かす単体テスト（lib/sender_core の純粋ロジックのみ）
;   pio test -e native
;   ※ PC に C++ コンパイラ（macOS なら Xcode Command Line Tools）が必要。
; ------------------------------------------------------------
[env:native]
platform = platformio/native@1.2.1
test_framework = unity
build_flags =
	-std=c++17
	-Wall
	-Wextra
